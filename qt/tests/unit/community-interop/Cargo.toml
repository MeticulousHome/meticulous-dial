[package]
name = "community-interop"
version = "0.1.0"
edition = "2024"
publish = false

# Runs the Tauri Dial's own src-tauri/src/community_upload.rs (not a copy) so the Qt port can be checked
# against it: see run.sh and tst_community_service's interopWithTheTauriUploader.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.28"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
