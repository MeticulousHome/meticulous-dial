# Drop-in that makes meticulous-dial.service run the Qt Dial instead of the WebKit one, straight on DRM/KMS
# without Weston. dial-switch qt installs it as /etc/systemd/system/meticulous-dial.service.d/qt.conf;
# dial-switch web removes it. Keeping the unit's name keeps what the image builds on it working: the nightly
# meticulous-restart, the watcher's service check and log collection, crash-reporter, the smoke report.
[Unit]
Description=Meticulous Dial (Qt Quick, straight on DRM/KMS)
# Not Weston's client any more: it must be the DRM master instead.
Requires=
After=
After=network.target meticulous-backend.service systemd-user-sessions.service plymouth-quit-wait.service
Conflicts=weston.service

[Service]
ExecStartPre=
ExecStart=
ExecStart=/usr/bin/meticulous-dial-qt-launch
Restart=always
RestartSec=1
