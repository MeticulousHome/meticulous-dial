on:
  workflow_call:

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      # Step 1
      - uses: actions/checkout@v2
      # Step 2
      - uses: actions/setup-node@v3
        with:
          node-version-file: '.node-version'
      # Step 3
      - name: Install dependencies
        run: npm install
      # Step 4
      - name: Check code format
        run: npm run format:check
      # Step 5
      - name: Check types
        run: npm run types
      - name: Check Free Pour motion detection
        run: npm run test:free-pour
      - name: Check home screen selection
        run: npm run test:profile-home-selection
      - name: Check Pour Over profile contract
        run: npm run test:pour-over-profile
      - name: Run TypeScript module tests
        run: npm test
      - name: Install scale regression browser
        run: npx playwright install --with-deps chromium
      - name: Check fullscreen scale gestures
        run: npm run test:scale-overlay
      - name: Upload scale regression evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scale-overlay-regression
          path: test-results/scale-overlay
          if-no-files-found: ignore
      - name: Static analysis
        run: npm run lint
      # Step 6
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Build frontend (required by tauri::generate_context)
        run: npm run build
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # Step 7
      - name: Build Application and Run unit Test
        run: exit 0
        if: false
