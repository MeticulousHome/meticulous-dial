name: Continuous integration

# The Dial's own gates, in parallel. Every job must pass for a pull request to
# merge (see AGENTS.md for what each one protects and how to run it locally).
# The journeys against the real backend and firmware run in the private
# meticulous-integration repository and come back as the `integration/e2e`
# commit status (integration-dispatch.yml).
on:
  workflow_call:

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Types
        run: npm run types
      - name: Lint (warnings may only go down)
        run: npm run lint -- --max-warnings 2

  unit:
    name: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Every test file is run by CI
        run: node scripts/check-ci-runs-every-test.mjs
      - name: Unit tests
        run: npm run test:all

  component:
    name: component
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Scale overlay (real components, simulated machine)
        run: npm run test:scale-overlay
      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scale-overlay-regression
          path: test-results/scale-overlay
          if-no-files-found: ignore
      - name: Community saved-brew recovery (real components, simulated machine)
        run: npm run test:community-upload
      - name: Keep saved-brew recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-upload-regression
          path: test-results/community-upload
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Production build (what the image ships)
        run: npm run build

  rust:
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: npm ci
      - name: Build the frontend (tauri::generate_context embeds it)
        run: npm run build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  backend-contract:
    name: backend-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - name: Pick the backend branch this Dial branch pairs with
        id: backend
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          # The same-name branch when the change spans both repositories, else
          # the branch this one merges into (beta with beta, ...), else beta.
          for ref in "$HEAD_REF" "$BASE_REF" beta; do
            if [ -n "$ref" ] && git ls-remote --exit-code --heads \
                https://github.com/MeticulousHome/meticulous-backend "$ref" >/dev/null; then
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              echo "backend branch: $ref"
              break
            fi
          done
      - uses: actions/checkout@v4
        with:
          repository: MeticulousHome/meticulous-backend
          ref: ${{ steps.backend.outputs.ref }}
          path: backend
          sparse-checkout: tests/contracts
      - name: Everything the Dial uses is in the backend contract
        run: node scripts/check-backend-contract.mjs --backend backend
