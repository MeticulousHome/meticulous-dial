name: Continuous integration

# The Dial's own gates (see AGENTS.md for what each one protects and how to run
# it locally): the Qt Dial built for amd64 and the machine (arm64) in the
# bookworm image, everything that runs without a machine (the QML smoke, the
# C++ unit tests, the JavaScript unit tests, the package as an artifact), and
# the backend contract. Nothing here reaches a real service: the Dial runs
# guarded (DIAL_EXTERNAL_SERVICES unset) and the smoke has no network. The
# journeys against the real backend and firmware run in the private
# meticulous-integration repository and come back as the `integration/e2e`
# commit status (integration-dispatch.yml).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the package version counts the commits

      - uses: docker/setup-buildx-action@v3

      - name: Build image (Debian bookworm, Qt 6.4.2, arm64 cross toolchain)
        uses: docker/build-push-action@v6
        with:
          context: qt/docker
          file: qt/docker/Dockerfile.bookworm
          tags: qt-dial-bookworm
          load: true
          cache-from: type=gha,scope=qt-dial-bookworm
          cache-to: type=gha,mode=max,scope=qt-dial-bookworm

      - name: Build amd64 and arm64
        run: bash qt/scripts/build.sh

      - name: QML smoke (syntax of every file, every route opened)
        run: bash qt/scripts/qml-smoke.sh

      - name: C++ unit tests
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" -w /repo/qt qt-dial-bookworm bash -c '
            set -e
            cmake -S . -B build/tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAL_BUILD_TESTS=ON >/dev/null
            cmake --build build/tests
            cd build/tests && ctest --output-on-failure'

      - name: JavaScript unit tests
        run: bash qt/scripts/js-tests.sh

      - name: Package (arm64 .deb)
        run: bash qt/scripts/package-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: meticulous-dial-arm64-deb
          path: qt/build/meticulous-dial_*_arm64.deb
          retention-days: 14

  backend-contract:
    name: backend-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Pick the backend branch this Dial branch pairs with
        id: backend
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          # The same-name branch when the change spans both repositories, else
          # the branch this one merges into (beta with beta, ...), else beta.
          for ref in "$HEAD_REF" "$BASE_REF" beta; do
            if [ -n "$ref" ] && git ls-remote --exit-code --heads \
                https://github.com/MeticulousHome/meticulous-backend "$ref" >/dev/null; then
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              echo "backend branch: $ref"
              break
            fi
          done
      - uses: actions/checkout@v4
        with:
          repository: MeticulousHome/meticulous-backend
          ref: ${{ steps.backend.outputs.ref }}
          path: backend
          sparse-checkout: tests/contracts
      - name: Everything the Dial uses is in the backend contract
        run: node scripts/check-backend-contract.mjs --backend backend
