# The Qt Dial (qt/): build for amd64 and the machine (arm64) in the bookworm image, then everything that
# runs without a machine or the private backend: the QML smoke (syntax, every route opened), the C++ unit
# tests, the React unit tests on the QML ports, and the package as an artifact. The end-to-end tests and the
# meticulous-integration journeys need meticulous-backend (private) and fika-sil: run them locally
# (docs/qt-migration/TESTING.md). Nothing here reaches a real service: the Dial runs guarded
# (DIAL_EXTERNAL_SERVICES unset) and the smoke has no network.
name: Qt Dial

on:
  push:
    branches: [qt-migration]
    paths:
      - 'qt/**'
      - 'src/**'
      - 'tests/**'
      - 'src-tauri/test-vectors/**'
      - '.github/workflows/qt-dial.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-dial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the package version counts the commits

      - uses: docker/setup-buildx-action@v3

      - name: Build image (Debian bookworm, Qt 6.4.2, arm64 cross toolchain)
        uses: docker/build-push-action@v6
        with:
          context: qt/docker
          file: qt/docker/Dockerfile.bookworm
          tags: qt-dial-bookworm
          load: true
          cache-from: type=gha,scope=qt-dial-bookworm
          cache-to: type=gha,mode=max,scope=qt-dial-bookworm

      - name: Build amd64 and arm64
        run: bash qt/scripts/build.sh

      - name: QML smoke (syntax of every file, every route opened)
        run: bash qt/scripts/qml-smoke.sh

      - name: C++ unit tests
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" -w /repo/qt qt-dial-bookworm bash -c '
            set -e
            cmake -S . -B build/tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DDIAL_BUILD_TESTS=ON >/dev/null
            cmake --build build/tests
            cd build/tests && ctest --output-on-failure'

      - name: React unit tests on the QML ports
        run: bash qt/scripts/js-tests.sh

      - name: Package (arm64 .deb)
        run: bash qt/scripts/package-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: meticulous-dial-qt-arm64-deb
          path: qt/build/meticulous-dial-qt_*_arm64.deb
          retention-days: 14
